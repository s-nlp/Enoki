[metadata]
name = enoki-openie
version = 0.1.0
description = Open information extraction for multi-level hallucination detection
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/s-nlp/Enoki
project_urls =
    Encoder model = https://huggingface.co/s-nlp/enoki-openie-encoder
    EnokiQA dataset = https://dataverse.harvard.edu/dataset.xhtml?persistentId=doi:10.7910/DVN/6TN4ZM

[options]
packages = find:
py_modules =
    decontextualizer
    enoki_cli
    fact_alignment
    factextractor_backend
    train_encoder
python_requires = >=3.9
install_requires =
    typer>=0.12
include_package_data = True

[options.packages.find]
include =
    enoki*
    evaluation*
    fact_extractor*
    model*
    nli*

[options.extras_require]
encoder =
    torch>=2.0
    transformers>=4.40
llm =
    openai>=1.0
    python-dotenv>=1.0
rules =
    spacy>=3.5
train =
    lightning>=2.0
    numpy
    scipy
    torch>=2.0
    transformers>=4.40
benchmark =
    accelerate
    datasets
    fastcoref
    numpy
    openai>=1.0
    python-dotenv>=1.0
    requests
    scikit-learn
    scipy
    spacy>=3.5
    stanford-openie
    torch>=2.0
    tqdm
    transformers>=4.40
all =
    accelerate
    datasets
    fastcoref
    lightning>=2.0
    numpy
    openai>=1.0
    python-dotenv>=1.0
    requests
    scikit-learn
    scipy
    spacy>=3.5
    stanford-openie
    torch>=2.0
    tqdm
    transformers>=4.40

[options.entry_points]
console_scripts =
    enoki = enoki.__main__:main
